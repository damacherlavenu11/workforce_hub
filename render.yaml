# Free pilot: remote PostgreSQL persistence, no paid disk, uploads disabled.
services:
  - type: web
    name: workforce-hub
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile.free
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: WORKFORCE_ENV
        value: production
      - key: HOSTING_TIER
        value: free
      - key: WORKFORCE_DATA
        value: /tmp/workforce
      - key: PUBLIC_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: workforce-documents
      - key: TRUST_PROXY
        value: "1"
