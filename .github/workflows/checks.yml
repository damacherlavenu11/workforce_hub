name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check static/app.js
      - run: docker build --tag workforce-hub:test .
      - run: docker run --rm --entrypoint python -v "$PWD/tests:/tests:ro" workforce-hub:test /tests/check_clamav.py
      - run: docker run --rm --entrypoint python -v "$PWD/tests:/tests:ro" workforce-hub:test /tests/check_runtime.py
