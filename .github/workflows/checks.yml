name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check static/app.js
      - run: docker build --tag workforce-hub:test .
      - run: docker build -f Dockerfile.free --tag workforce-hub:free-test .
      - run: docker run --rm --entrypoint python -v "$PWD/tests:/tests:ro" workforce-hub:test /tests/check_clamav.py
      - run: docker run --rm --entrypoint python -v "$PWD/tests:/tests:ro" workforce-hub:test /tests/check_runtime.py
      - run: docker run --rm --entrypoint python -v "$PWD/tests:/tests:ro" workforce-hub:free-test /tests/check_runtime.py
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: workforce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test-password@localhost:5432/workforce_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
